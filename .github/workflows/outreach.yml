name: outreach
on:
  workflow_dispatch:
    inputs:
      batch: {description: "CSV in outreach/", default: "leads.csv"}
      template: {description: "initial or followup", default: "initial"}
permissions: {contents: write}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outreach/send.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BATCH: ${{ inputs.batch }}
          TEMPLATE: ${{ inputs.template }}
      - run: |
          git config user.email siteworkqld@gmail.com; git config user.name "Sitework bot"
          git add outreach/sent.log && git commit -m "log sends" && git push || true
